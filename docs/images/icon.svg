<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2622"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2b8"/>
      <stop offset="0.35" stop-color="#e8875f"/>
      <stop offset="1" stop-color="#e8875f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <!-- the light inside: seen through every face -->
  <circle cx="512" cy="560" r="190" fill="url(#core)"/>
  <circle cx="512" cy="560" r="62" fill="#ef8c62"/>
  <!-- the glass faces -->
  <g stroke="#f4efe9" stroke-width="16" stroke-linejoin="round">
    <polygon points="512,250 772,400 512,550 252,400" fill="#ffffff" fill-opacity="0.16"/>
    <polygon points="252,400 512,550 512,850 252,700" fill="#ffffff" fill-opacity="0.07"/>
    <polygon points="512,550 772,400 772,700 512,850" fill="#ffffff" fill-opacity="0.04"/>
  </g>
  <!-- the edges behind, faint through the glass -->
  <g stroke="#f4efe9" stroke-opacity="0.35" stroke-width="8" stroke-dasharray="18 16" fill="none">
    <line x1="512" y1="250" x2="512" y2="550"/>
    <line x1="252" y1="700" x2="512" y2="550"/>
    <line x1="772" y1="700" x2="512" y2="550"/>
  </g>
</svg>
