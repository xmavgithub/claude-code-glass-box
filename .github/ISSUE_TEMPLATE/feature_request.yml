name: Feature request
description: Something Glass Box could show, or show better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to understand about Claude's work?
      description: The question you could not answer by looking at the pane.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What Glass Box could show
      description: The data, and where or how it could appear in the pane.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
